# Quant-Research-Fundamental-MultiFactor 全局配置

# 数据配置
data:
  # 股票池
  universe: "hs300"  # 沪深300成分股
  # 回测时间范围（估值数据自2018年起可得，2018-2019作为动量因子预热窗口）
  start_date: "20200101"
  end_date: "20260801"
  # 基准指数
  benchmark: "sh000300"
  # 数据存放路径
  raw_dir: "data/raw"
  processed_dir: "data/processed"

# 因子配置
factor:
  name: "fundamental_multi_factor"
  # 各因子合成权重（等权）
  weights:
    ep: 0.20         # 盈利收益率 1/PE(TTM)
    bp: 0.20         # 账面市值比 1/PB
    roe: 0.20        # ROE(TTM) 盈利能力
    size: 0.20       # 小市值 -ln(总市值)
    momentum: 0.20   # 12-1月动量
  # 动量因子参数（交易日）
  momentum_long_window: 252
  momentum_skip_window: 21
  # 财报披露滞后（自然日，按报告季度区分，用于ROE时点对齐）
  disclosure_lag:
    q1: 30    # 一季报: 3/31 -> 4/30
    q2: 62    # 半年报: 6/30 -> 8/31
    q3: 31    # 三季报: 9/30 -> 10/31
    q4: 121   # 年报: 12/31 -> 4/30

# 回测配置
backtest:
  # 初始资金
  initial_cash: 1000000
  # 手续费率（万分之三）
  commission: 0.0003
  # 印花税率（千分之一，仅卖出）
  stamp_tax: 0.001
  # 滑点（千分之一，单边）
  slippage: 0.001
  # 调仓频率
  rebalance_freq: "monthly"
  # 分组数量（分层回测）
  num_groups: 5
  # 组合持仓数量（取得分最高的前N只）
  top_n: 30

# 结果输出
results:
  report_dir: "results/reports"
  plot_dir: "results/plots"

# 权重优化配置（scripts/run_weight_optimization.py）
weight_optimization:
  # ICIR动态加权的滚动窗口（月）
  icir_window: 12
  # 最大化组合ICIR的滚动窗口（月）
  max_icir_window: 36
  max_icir_min_periods: 24
  # 机器学习walk-forward训练窗口（月）
  ml_train_window: 36
  ml_min_train_periods: 24
