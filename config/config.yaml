# Quant-Research-Fundamental-MultiFactor global configuration

# Data configuration
data:
  # Stock universe
  universe: "hs300"  # CSI 300 constituents
  # Backtest period (valuation data available from 2018; 2018-2019 serves as
  # the warm-up window for the momentum factor)
  start_date: "20200101"
  end_date: "20260801"
  # Benchmark index
  benchmark: "sh000300"
  # Data storage paths
  raw_dir: "data/raw"
  processed_dir: "data/processed"

# Factor configuration
factor:
  name: "fundamental_multi_factor"
  # Combining weights for each factor (equal weight)
  weights:
    ep: 0.20         # Earnings yield 1/PE(TTM)
    bp: 0.20         # Book-to-market ratio 1/PB
    roe: 0.20        # ROE(TTM) profitability
    size: 0.20       # Small cap -ln(total market cap)
    momentum: 0.20   # 12-1 month momentum
  # Momentum factor parameters (trading days)
  momentum_long_window: 252
  momentum_skip_window: 21
  # Financial report disclosure lag (calendar days, per report quarter,
  # used for point-in-time alignment of ROE)
  disclosure_lag:
    q1: 30    # Q1 report: 3/31 -> 4/30
    q2: 62    # Semi-annual report: 6/30 -> 8/31
    q3: 31    # Q3 report: 9/30 -> 10/31
    q4: 121   # Annual report: 12/31 -> 4/30

# Backtest configuration
backtest:
  # Initial capital
  initial_cash: 1000000
  # Commission rate (0.03%)
  commission: 0.0003
  # Stamp tax rate (0.1%, sell side only)
  stamp_tax: 0.001
  # Slippage (0.1%, one way)
  slippage: 0.001
  # Rebalance frequency
  rebalance_freq: "monthly"
  # Number of groups (quantile backtest)
  num_groups: 5
  # Number of portfolio holdings (top N by combined score)
  top_n: 30

# Result output
results:
  report_dir: "results/reports"
  plot_dir: "results/plots"

# Weight optimization configuration (scripts/run_weight_optimization.py)
weight_optimization:
  # Rolling window for dynamic ICIR weighting (months)
  icir_window: 12
  # Rolling window for portfolio ICIR maximization (months)
  max_icir_window: 36
  max_icir_min_periods: 24
  # ML walk-forward training window (months)
  ml_train_window: 36
  ml_min_train_periods: 24
  # Half-life for EWMA-IC weighting (months)
  ewma_halflife: 6
  # Orthogonalization order (factors to preserve first come earlier)
  ortho_order: ["size", "ep", "bp", "roe", "momentum"]
  # Mean-variance weighting: rolling window of factor long-short returns (months)
  mv_window: 36
  mv_min_periods: 24
  # Shrinkage ratio of the ML ensemble toward the equal-weight score (0=pure ML, 1=pure equal weight)
  ml_shrinkage: 0.3
  # Volatility estimation window for inverse-volatility weighting (trading days)
  inv_vol_window: 63
